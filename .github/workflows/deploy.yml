name: Deploy AIMarg Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: aihelp-frontend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/AIMarg_frontend
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            if pm2 describe aihelp-frontend >/dev/null 2>&1; then
  pm2 restart aihelp-frontend --update-env
else
  pm2 start npm --name aihelp-frontend -- start -- -p 3000
fi
            pm2 save
